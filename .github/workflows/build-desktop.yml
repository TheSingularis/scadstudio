name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ['v*', 'beta-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional. Cut a pre-release with this tag (e.g. beta-v0.1.1) at the dispatched commit. Run from main.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@scadstudio/desktop

      - name: Build AppImage
        run: npm run package:linux --workspace=@scadstudio/desktop

      # electron-builder only needs to unzip a prebuilt Electron to *package* the
      # app, but doesn't need a display or GUI libs for that. This step is a real
      # smoke test on top: extract the AppImage and actually launch it headlessly
      # under Xvfb (same technique used for manual milestone verification) so a
      # packaging regression doesn't silently ship as a broken AppImage. See
      # PLAN.md's CI/CD notes for why this matters — a plausible-looking build can
      # still be missing a runtime dependency.
      - name: Install headless runtime deps for smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0
          # Package name flipped (libasound2 -> libasound2t64) across Ubuntu
          # versions during the 64-bit time_t transition; try both.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Smoke test the packaged AppImage
        run: |
          set -e
          APPIMAGE=$(ls apps/desktop/dist/*.AppImage)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          SCADSTUDIO_SCREENSHOT=/tmp/smoke.png \
            timeout 25 xvfb-run -a ./squashfs-root/AppRun \
              --no-sandbox --use-gl=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
              2>&1 | tee /tmp/smoke.log
          test -s /tmp/smoke.png
          [ "$(stat -c%s /tmp/smoke.png)" -gt 10000 ]
          ! grep -q "Uncaught" /tmp/smoke.log
          ! grep -q "render failed" /tmp/smoke.log

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot-linux
          path: /tmp/smoke.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: scadstudio-appimage
          path: apps/desktop/dist/*.AppImage
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@scadstudio/desktop

      # "portable" target: a single self-contained .exe (NSIS stub that
      # extracts to %TEMP% and launches on run), no installer, same
      # just-run-it spirit as the Linux AppImage. Unsigned (no code-signing
      # cert), so Windows SmartScreen will show an unrecognized-publisher
      # warning on first run — acceptable for a private beta.
      - name: Build portable exe
        run: npm run package:win --workspace=@scadstudio/desktop

      # Same principle as the Linux smoke test: a build that completes
      # doesn't prove the packaged app actually launches. windows-latest
      # runners have no GPU, so this needs the same software-rendering
      # fallback as Xvfb-under-Linux; using bash here (present on
      # windows-latest via Git for Windows) rather than PowerShell so this
      # stays close to the Linux job's already-proven approach. Screenshot
      # path uses $RUNNER_TEMP (not /tmp) specifically so both this bash step
      # and the native-Node upload-artifact step below can resolve the same
      # file — a hardcoded /tmp path is silently unresolvable by
      # upload-artifact on Windows even though bash (via Git-Bash's own path
      # translation) finds it just fine, so the smoke test itself passes
      # while the screenshot artifact quietly never uploads (caught on this
      # workflow's first real Windows CI run).
      - name: Smoke test the packaged exe
        shell: bash
        run: |
          set -e
          EXE=$(ls apps/desktop/dist/*.exe)
          SCREENSHOT="$RUNNER_TEMP/smoke-win.png"
          # 90s, not the Linux job's 25s: this runner's WASM compile/render
          # is measurably slower (see the render-completion poll loop added
          # to main/index.ts for the same reason) — a tighter timeout here
          # killed the process mid-poll on the first attempt with this fix,
          # before it ever reached the screenshot capture.
          SCADSTUDIO_SCREENSHOT="$SCREENSHOT" \
            timeout 90 "$EXE" --no-sandbox --disable-gpu --use-gl=swiftshader \
              2>&1 | tee "$RUNNER_TEMP/smoke-win.log" || true
          test -s "$SCREENSHOT"
          [ "$(stat -c%s "$SCREENSHOT" 2>/dev/null || stat -f%z "$SCREENSHOT")" -gt 10000 ]
          ! grep -q "Uncaught" "$RUNNER_TEMP/smoke-win.log"
          ! grep -q "render failed" "$RUNNER_TEMP/smoke-win.log"

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot-windows
          path: ${{ runner.temp }}/smoke-win.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: scadstudio-exe
          path: apps/desktop/dist/*.exe
          retention-days: 7

  # Every push to master gets workflow-artifact builds (above) for quick
  # iteration; pushing a version tag (e.g. v0.1.0-beta.1) additionally cuts a
  # proper GitHub Release with both platform builds attached as a stable
  # download link. Runs as its own job (needs both builds) rather than
  # letting each build job call `gh release create` independently, to avoid
  # two parallel jobs racing to create the same release. Uses gh
  # (preinstalled on GitHub-hosted runners) + the auto-provisioned
  # GITHUB_TOKEN rather than a third-party action.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta-v') || inputs.release_tag != ''
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scadstudio-appimage
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: scadstudio-exe
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ -n "${{ inputs.release_tag }}" ] && ! [[ "$TAG" =~ ^beta-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must look like beta-v0.1.1"; exit 1
          fi
          # Hand-written notes in release-notes/<tag>.md win; otherwise fall back
          # to GitHub's generated notes. See RELEASING.md.
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$TAG" dist/*.AppImage dist/*.exe \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "scadstudio $TAG" \
            --prerelease \
            "${NOTES_ARGS[@]}"
