name: No AI attribution

# Fails if tool attribution (co-author trailers, session links, "generated
# with" footers) appears in the tree or in a PR's commit messages.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan tracked files
        run: |
          pat='co-authored-by:.*(claude|anthropic)|claude-session:|generated (with|by) \[?claude|claude\.ai/code|noreply@anthropic\.com'
          if git grep -nIiE "$pat" -- . ':!.github/workflows/no-ai-attribution.yml'; then
            echo "::error::AI attribution found in tracked files"; exit 1
          fi
      - name: Scan PR commit messages
        if: github.event_name == 'pull_request'
        run: |
          pat='co-authored-by:.*(claude|anthropic)|claude-session:|generated (with|by) \[?claude|claude\.ai/code|noreply@anthropic\.com'
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          if git log --no-merges --format='%H%n%an <%ae>%n%B' "$range" | grep -iE "$pat"; then
            echo "::error::AI attribution found in commit messages"; exit 1
          fi
