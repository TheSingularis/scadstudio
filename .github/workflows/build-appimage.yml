name: Build AppImage

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@scadstudio/desktop

      - name: Build AppImage
        run: npm run package:linux --workspace=@scadstudio/desktop

      # electron-builder only needs to unzip a prebuilt Electron to *package* the
      # app, but doesn't need a display or GUI libs for that. This step is a real
      # smoke test on top: extract the AppImage and actually launch it headlessly
      # under Xvfb (same technique used for manual milestone verification) so a
      # packaging regression doesn't silently ship as a broken AppImage. See
      # PLAN.md's CI/CD notes for why this matters — a plausible-looking build can
      # still be missing a runtime dependency.
      - name: Install headless runtime deps for smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0
          # Package name flipped (libasound2 -> libasound2t64) across Ubuntu
          # versions during the 64-bit time_t transition; try both.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Smoke test the packaged AppImage
        run: |
          set -e
          APPIMAGE=$(ls apps/desktop/dist/*.AppImage)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          SCADSTUDIO_SCREENSHOT=/tmp/smoke.png \
            timeout 25 xvfb-run -a ./squashfs-root/AppRun \
              --no-sandbox --use-gl=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
              2>&1 | tee /tmp/smoke.log
          test -s /tmp/smoke.png
          [ "$(stat -c%s /tmp/smoke.png)" -gt 10000 ]
          ! grep -q "Uncaught" /tmp/smoke.log
          ! grep -q "render failed" /tmp/smoke.log

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: /tmp/smoke.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: scadstudio-appimage
          path: apps/desktop/dist/*.AppImage
          retention-days: 14

      # Every push to master gets a workflow-artifact build (above) for quick
      # iteration; pushing a version tag (e.g. v0.1.0-beta.1) additionally cuts
      # a proper GitHub Release with the AppImage attached as a stable download
      # link. Uses gh (preinstalled on GitHub-hosted runners) + the
      # auto-provisioned GITHUB_TOKEN rather than a third-party action.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(ls apps/desktop/dist/*.AppImage)
          gh release create "${{ github.ref_name }}" "$APPIMAGE" \
            --title "scadstudio ${{ github.ref_name }}" \
            --prerelease \
            --generate-notes
